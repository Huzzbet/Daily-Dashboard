<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Internal Market & Advice Dashboard</title>

<style>
:root{
  --bg:#0b1220;
  --card:#0f1828;
  --border:rgba(255,255,255,.08);
  --text:#e7eefc;
  --muted:#9fb0d0;
  --green:#2bd47d;
  --amber:#ffd166;
  --red:#ff5c7a;
  --accent:#6ee7ff;
  --shadow:0 18px 40px rgba(0,0,0,.35);
  --radius:22px;
  --font:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--font);
  background:
    radial-gradient(900px 500px at 50% -20%, #13284a, transparent),
    var(--bg);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:22px 18px 60px;
}

h1{margin:0;font-size:26px;font-weight:600}
.sub{margin-top:6px;color:var(--muted);font-size:14px}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-top:22px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.card-header h2{margin:0;font-size:17px;font-weight:600}
.card-header span{font-size:13px;color:var(--muted)}

.btn{
  margin-top:14px;
  padding:10px 16px;
  border-radius:14px;
  background:rgba(110,231,255,.14);
  border:1px solid rgba(110,231,255,.35);
  color:var(--text);
  font-weight:600;
  cursor:pointer;
}

.btn:hover{filter:brightness(1.1)}

.regime{
  font-size:18px;
  margin:12px 0 6px;
}

.regime-dot{
  display:inline-block;
  width:18px;
  height:18px;
  border-radius:50%;
  margin-right:8px;
  vertical-align:middle;
}

.market-table{
  width:100%;
  border-collapse:collapse;
}

.market-table th{
  text-align:left;
  font-size:11px;
  color:var(--muted);
  letter-spacing:.12em;
  padding:12px 6px;
}

.market-table td{
  padding:14px 6px;
  font-size:15px;
}

.market-table tr:not(:last-child){
  border-bottom:1px solid var(--border);
}

.pos{color:var(--green)}
.neg{color:var(--red)}

.bullets{margin:12px 0 0 18px;padding:0}
.bullets li{margin:10px 0;font-size:15px;line-height:1.45}

.news-list{list-style:none;padding:0;margin:8px 0 0 0}
.news-list li{margin:10px 0}
.news-list a{color:#dbe6ff;text-decoration:none}
.news-list a:hover{color:var(--accent);text-decoration:underline}
</style>
</head>

<body>
<div class="container">

<h1>Internal Market & Advice Dashboard</h1>
<div class="sub">Australia · Melbourne · Internal Use Only</div>

<button class="btn" onclick="refreshData()">🔄 Refresh</button>

<!-- MARKET REGIME -->
<div class="card">
  <div class="card-header">
    <h2>Market Regime</h2>
    <span>High-level context</span>
  </div>

  <div class="regime" id="regimeLabel"></div>
  <ul class="bullets" id="regimeDrivers"></ul>
</div>

<!-- CLIENT TALKING POINTS -->
<div class="card">
  <div class="card-header">
    <h2>Client Talking Points</h2>
    <span>Auto-generated</span>
  </div>
  <ul class="bullets" id="clientTalkingPoints"></ul>
</div>

<!-- MARKET TABLE -->
<div class="card">
  <div class="card-header">
    <h2>Market Performance Overview</h2>
    <span>Daily · YTD · CY</span>
  </div>

  <table class="market-table">
    <thead>
      <tr>
        <th>ASSET</th>
        <th>LEVEL</th>
        <th>1-DAY</th>
        <th>2026 YTD</th>
        <th>2025 CY</th>
      </tr>
    </thead>
    <tbody id="marketRows"></tbody>
  </table>
</div>

</div>

<script>
function refreshData(){

  const markets = {
    asx:+0.62,
    sp:-0.31,
    vix:13.8,
    yields:-6,
    aud:+0.48
  };

  // ===== RISK ENGINE =====
  let regime = "Neutral";
  let colour = "--amber";
  let dot = "#ffd166";

  if(markets.vix < 15 && markets.yields < 0 && markets.aud > 0){
    regime = "Risk-On";
    colour = "--green";
    dot = "#2bd47d";
  }

  if(markets.vix > 20){
    regime = "Risk-Off";
    colour = "--red";
    dot = "#ff5c7a";
  }

  regimeLabel.innerHTML = `
    Current stance:
    <span style="color:var(${colour});font-weight:600;">
      <span class="regime-dot" style="background:${dot}"></span>${regime}
    </span>
  `;

  // ===== REGIME DRIVERS =====
  regimeDrivers.innerHTML = `
    <li>Volatility subdued with VIX below stress levels</li>
    <li>Bond yields easing, supporting growth assets</li>
    <li>USD softer, lifting AUD and commodities</li>
  `;

  // ===== CLIENT TALKING POINTS =====
  clientTalkingPoints.innerHTML = `
    <li>Market conditions remain constructive, with lower volatility supporting equity exposure.</li>
    <li>Falling bond yields are providing a tailwind for growth assets and longer-duration investments.</li>
    <li>A softer US dollar has supported the Australian dollar and commodity-related sectors.</li>
    <li>Overall positioning remains appropriate for a diversified, growth-oriented portfolio.</li>
  `;

  // ===== MARKET TABLE =====
  marketRows.innerHTML = [
    ["ASX 200","7,482","+0.62%","+3.4%","+9.8%"],
    ["S&P 500","4,892","-0.31%","+1.9%","+22.4%"],
    ["NASDAQ","—","—","-0.8%","+31.6%"],
    ["AUD / USD","0.672","+0.48%","—","-4.1%"],
    ["US 10Y Yield","4.12%","-6 bps","-14 bps","—"],
    ["Gold","2,048","+1.10%","+2.7%","+13.2%"],
    ["VIX","13.8","-4.2%","-9.5%","-18.7%"]
  ].map(r=>`
    <tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td class="${r[2].includes('-')?'neg':'pos'}">${r[2]}</td>
      <td class="${r[3].includes('-')?'neg':'pos'}">${r[3]}</td>
      <td class="${r[4].includes('-')?'neg':'pos'}">${r[4]}</td>
    </tr>
  `).join("");
}

refreshData();
</script>

</body>
</html>
