<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Internal Market & Advice Dashboard</title>
<style>
:root{--bg:#0b1220;--card:#0f1828;--border:rgba(255,255,255,.08);--text:#e7eefc;--muted:#9fb0d0;
--green:#2bd47d;--amber:#ffd166;--red:#ff5c7a;--accent:#6ee7ff;--shadow:0 18px 40px rgba(0,0,0,.35);
--radius:22px;--font:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:radial-gradient(900px 500px at 50% -20%, #13284a, transparent),var(--bg);color:var(--text)}
.container{max-width:1200px;margin:auto;padding:22px 18px 60px}
h1{margin:0;font-size:26px;font-weight:600}.sub{color:var(--muted);font-size:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--border);
border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:22px}
.card-header{display:flex;justify-content:space-between;align-items:center}
.btn{margin-top:14px;padding:11px 18px;border-radius:14px;background:linear-gradient(180deg, rgba(110,231,255,.25), rgba(110,231,255,.12));
border:1px solid rgba(110,231,255,.35);color:var(--text);font-weight:600;cursor:pointer}
.market-table{width:100%;border-collapse:collapse}
.market-table th{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:12px 6px;text-align:left}
.market-table td{padding:14px 6px;font-size:15px}
.market-table tr:not(:last-child){border-bottom:1px solid var(--border)}
.pos{color:var(--green)}.neg{color:var(--red)}
</style>
</head>
<body>
<div class="container">
<h1>Internal Market & Advice Dashboard</h1>
<div class="sub">Australia · Melbourne · Internal Use Only</div>
<button class="btn" onclick="refreshData()">🔄 Refresh</button>

<div class="card"><div class="card-header"><h2>Market Performance Overview</h2><span>Daily · YTD · CY</span></div>
<table class="market-table"><thead>
<tr><th>ASSET</th><th>TICKER</th><th>LEVEL</th><th>1-DAY</th><th>2026 YTD</th><th>2025 CY</th></tr>
</thead><tbody id="marketRows"></tbody></table></div>
</div>

<script>
const PROXY="https://wild-dream-69cc.seanhurren.workers.dev";
const ASSETS=[
{name:"ASX 200",symbol:"^AXJO"},
{name:"S&P 500",symbol:"^GSPC"},
{name:"NASDAQ",symbol:"^IXIC"},
{name:"AUD / USD",symbol:"AUDUSD=X"},
{name:"US 10Y Yield",symbol:"^TNX",y:true},
{name:"Gold",symbol:"GC=F"},
{name:"VIX",symbol:"^VIX"}
];

async function fetchRange(sym,range){
const r=await fetch(`${PROXY}?symbol=${encodeURIComponent(sym)}&range=${range}`);
const j=await r.json();return j.chart.result[0];
}

function pct(a,b){return(((a-b)/b)*100).toFixed(2)+"%";}

async function refreshData(){
let rows="";
for(const a of ASSETS){
const day=await fetchRange(a.symbol,"1d");
const ytd=await fetchRange(a.symbol,"ytd");
const cy=await fetchRange(a.symbol,"1y");

let cur=day.meta.regularMarketPrice,prev=day.meta.previousClose;
let ytdStart=ytd.meta.chartPreviousClose;
let cyStart=cy.meta.chartPreviousClose;

if(a.y){cur/=10;prev/=10;ytdStart/=10;cyStart/=10;}

rows+=`<tr>
<td>${a.name}</td><td>${a.symbol}</td>
<td>${cur.toFixed(2)}${a.y?"%":""}</td>
<td class="${cur>=prev?"pos":"neg"}">${a.y?((cur-prev)*100).toFixed(0)+" bps":pct(cur,prev)}</td>
<td class="${cur>=ytdStart?"pos":"neg"}">${pct(cur,ytdStart)}</td>
<td class="${cur>=cyStart?"pos":"neg"}">${pct(cur,cyStart)}</td>
</tr>`;
}
marketRows.innerHTML=rows;
}
refreshData();
</script>
</body>
</html>
