<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Internal Market & Advice Dashboard</title>

<style>
:root{
  --bg:#0b1220;
  --card:#0f1828;
  --border:rgba(255,255,255,.08);
  --text:#e7eefc;
  --muted:#9fb0d0;
  --green:#2bd47d;
  --red:#ff5c7a;
  --accent:#6ee7ff;
  --shadow:0 18px 40px rgba(0,0,0,.35);
  --radius:22px;
  --font:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--font);
  background:radial-gradient(900px 500px at 50% -20%, #13284a, transparent), var(--bg);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:22px 18px 60px;
}

h1{
  margin:0;
  font-size:26px;
  font-weight:600;
}

.sub{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-top:22px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.card-header h2{
  margin:0;
  font-size:17px;
  font-weight:600;
}

.card-header span{
  font-size:13px;
  color:var(--muted);
}

/* ===== MARKET TABLE ===== */
.market-table{
  width:100%;
  border-collapse:collapse;
}

.market-table th{
  text-align:left;
  font-size:11px;
  color:var(--muted);
  letter-spacing:.12em;
  padding:12px 6px;
}

.market-table td{
  padding:14px 6px;
  font-size:15px;
}

.market-table tr:not(:last-child){
  border-bottom:1px solid var(--border);
}

.pos{color:var(--green)}
.neg{color:var(--red)}

/* ===== MARKET REGIME ===== */
.regime{
  font-size:18px;
  margin:12px 0 6px;
}

.regime span{
  color:var(--green);
  font-weight:600;
}

.regime-dot{
  display:inline-block;
  width:18px;
  height:18px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #7CFF9C, #2bd47d);
  margin-right:8px;
  vertical-align:middle;
}

.bullets{
  margin:12px 0 0 18px;
  padding:0;
}

.bullets li{
  margin:10px 0;
  font-size:15px;
  line-height:1.45;
}

.bullets a{
  color:#d6e0f0;
  text-decoration:none;
}

.bullets a:hover{
  color:var(--accent);
  text-decoration:underline;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:14px;
  padding:10px 16px;
  border-radius:14px;
  background:rgba(110,231,255,.14);
  border:1px solid rgba(110,231,255,.35);
  color:var(--text);
  font-weight:600;
  cursor:pointer;
}
.btn:hover{filter:brightness(1.1)}
</style>
</head>

<body>
<div class="container">

<h1>Internal Market & Advice Dashboard</h1>
<div class="sub">Australia · Melbourne · Internal Use Only</div>

<button class="btn" onclick="refreshData()">🔄 Refresh</button>

<!-- ===== MARKET REGIME ===== -->
<div class="card">
  <div class="card-header">
    <h2>Market Regime</h2>
    <span>High-level context</span>
  </div>

  <div class="regime">
    Current stance:
    <span><span class="regime-dot"></span>Risk-On</span>
  </div>

  <ul class="bullets" id="regimeDrivers"></ul>
</div>

<!-- ===== MARKET PERFORMANCE ===== -->
<div class="card">
  <div class="card-header">
    <h2>Market Performance Overview</h2>
    <span>Daily · YTD · CY</span>
  </div>

  <table class="market-table">
    <thead>
      <tr>
        <th>ASSET</th>
        <th>LEVEL</th>
        <th>1-DAY</th>
        <th>2026 YTD</th>
        <th>2025 CY</th>
      </tr>
    </thead>
    <tbody id="marketRows"></tbody>
  </table>
</div>

</div>

<script>
function refreshData(){

  // ===== MARKET REGIME DRIVERS =====
  regimeDrivers.innerHTML = `
    <li><a href="https://www.afr.com/markets/equity-markets/volatility-eases-as-markets-stabilise-202601" target="_blank">
      Volatility subdued; risk assets supported
    </a></li>
    <li><a href="https://www.afr.com/markets/debt-markets/us-bond-yields-fall-on-rate-cut-bets-202601" target="_blank">
      Bond yields easing, favouring growth exposure
    </a></li>
    <li><a href="https://www.afr.com/markets/currencies/us-dollar-slides-as-rate-cut-expectations-build-202601" target="_blank">
      USD softer, supporting AUD and commodities
    </a></li>
  `;

  // ===== MARKET TABLE =====
  marketRows.innerHTML = [
    ["ASX 200","7,482","+0.62%","+3.4%","+9.8%"],
    ["S&P 500","4,892","-0.31%","+1.9%","+22.4%"],
    ["NASDAQ","—","—","-0.8%","+31.6%"],
    ["AUD / USD","0.672","+0.48%","—","-4.1%"],
    ["US 10Y Yield","4.12%","-6 bps","-14 bps","—"],
    ["Gold","2,048","+1.10%","+2.7%","+13.2%"],
    ["VIX","13.8","-4.2%","-9.5%","-18.7%"]
  ].map(r=>`
    <tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td class="${r[2].includes('-')?'neg':'pos'}">${r[2]}</td>
      <td class="${r[3].includes('-')?'neg':'pos'}">${r[3]}</td>
      <td class="${r[4].includes('-')?'neg':'pos'}">${r[4]}</td>
    </tr>
  `).join("");
}

refreshData();
</script>

</body>
</html>
