<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daily Market Dashboard</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111a2e;
  --line:rgba(255,255,255,.08);
  --text:#e7eefc;
  --muted:#9fb0d0;
  --good:#3ad29f;
  --bad:#ff6b81;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--sans);
  background:radial-gradient(1200px 600px at 50% -10%,#162044,#0b1220);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:16px;
  border-bottom:1px solid var(--line);
  background:rgba(11,18,32,.85);
  backdrop-filter:blur(10px);
}

h1{
  margin:0;
  font-size:20px;
  font-weight:600;
}

.sub{
  margin-top:6px;
  font-size:12px;
  color:var(--muted);
  font-family:var(--mono);
}

main{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.tile{
  padding:16px;
  border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.tile strong{
  font-size:14px;
}

.price{
  margin-top:8px;
  font-family:var(--mono);
  font-size:18px;
}

.up{color:var(--good)}
.down{color:var(--bad)}
.flat{color:var(--muted)}

footer{
  max-width:1100px;
  margin:40px auto 20px;
  padding:0 16px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>Daily Market Dashboard</h1>
  <div class="sub" id="time">Loading…</div>
</header>

<main>
  <div class="tiles">
    <div class="tile"><strong>S&P 500</strong><div id="spx" class="price">Loading…</div></div>
    <div class="tile"><strong>NASDAQ</strong><div id="nasdaq" class="price">Loading…</div></div>
    <div class="tile"><strong>Dow Jones</strong><div id="dow" class="price">Loading…</div></div>
    <div class="tile"><strong>Apple</strong><div id="aapl" class="price">Loading…</div></div>
    <div class="tile"><strong>Microsoft</strong><div id="msft" class="price">Loading…</div></div>
    <div class="tile"><strong>Tesla</strong><div id="tsla" class="price">Loading…</div></div>
  </div>
</main>

<footer>
  <p><strong>Important:</strong> Internal information only. Not financial advice.</p>
</footer>

<script>
/* -------- TIME -------- */
function updateTime(){
  document.getElementById("time").textContent =
    new Intl.DateTimeFormat("en-AU",{
      timeZone:"Australia/Melbourne",
      weekday:"short",
      hour:"2-digit",
      minute:"2-digit"
    }).format(new Date());
}
updateTime();
setInterval(updateTime,60000);

/* -------- MARKET DATA (FMP DEMO API) -------- */
const API = "https://financialmodelingprep.com/api/v3/quote/";
const KEY = "demo";

async function load(symbol, el){
  try{
    const res = await fetch(`${API}${symbol}?apikey=${KEY}`);
    const data = (await res.json())[0];
    if(!data) throw "No data";

    const pct = data.changesPercentage.toFixed(2);
    const cls = pct > 0 ? "up" : pct < 0 ? "down" : "flat";

    document.getElementById(el).className = "price " + cls;
    document.getElementById(el).innerHTML =
      `${data.price}<br>${pct > 0 ? "▲" : "▼"} ${pct}%`;
  }catch{
    document.getElementById(el).textContent = "Unavailable";
  }
}

function refresh(){
  load("^GSPC","spx");
  load("^IXIC","nasdaq");
  load("^DJI","dow");
  load("AAPL","aapl");
  load("MSFT","msft");
  load("TSLA","tsla");
}

refresh();
setInterval(refresh,60000);
</script>

</body>
</html>
