name: Add CPI to RBA snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-rba-cpi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add CPI to RBA snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """async function loadRba(){try{let h=await fetchText(`${PROXY}?url=${encodeURIComponent('https://www.rba.gov.au/cash-rate-target-overview.html')}`),text=new DOMParser().parseFromString(h,'text/html').body.innerText.replace(/\\s+/g,' ').trim();let rate=text.match(/Cash rate target\\s+([0-9]+\\.[0-9]+)\\s*%/i)?.[1]||text.match(/Cash rate target.*?([0-9]+\\.[0-9]+)\\s*per cent/i)?.[1];let eff=text.match(/Effective date\\s+([0-9]{1,2}\\s+[A-Za-z]+\\s+20[0-9]{2})/i)?.[1]||'';let next=text.match(/Next update\\s+(.+?)(?=\\s+What is the cash rate|\\s+How do we|$)/i)?.[1]||'';if(!rate)throw Error('RBA rate not found');$('rba').innerHTML=`<div class=\"kpi\"><div class=\"label\">Cash rate target</div><div class=\"value\">${esc(rate)}%</div><div class=\"delta\">Effective ${esc(eff)}${next?' · '+esc(next):''}</div></div>`}catch{$('rba').innerHTML='<span class=\"neg\">RBA snapshot unavailable.</span>'}}"""
          new = """async function loadRba(){try{let [rh,ch]=await Promise.all([fetchText(`${PROXY}?url=${encodeURIComponent('https://www.rba.gov.au/cash-rate-target-overview.html')}`),fetchText(`${PROXY}?url=${encodeURIComponent('https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release')}`)]);let text=new DOMParser().parseFromString(rh,'text/html').body.innerText.replace(/\\s+/g,' ').trim();let cpiText=new DOMParser().parseFromString(ch,'text/html').body.innerText.replace(/\\s+/g,' ').trim();let rate=text.match(/Cash rate target\\s+([0-9]+\\.[0-9]+)\\s*%/i)?.[1]||text.match(/Cash rate target.*?([0-9]+\\.[0-9]+)\\s*per cent/i)?.[1];let eff=text.match(/Effective date\\s+([0-9]{1,2}\\s+[A-Za-z]+\\s+20[0-9]{2})/i)?.[1]||'';let next=text.match(/Next update\\s+(.+?)(?=\\s+What is the cash rate|\\s+How do we|$)/i)?.[1]||'';let cpi=cpiText.match(/CPI rose ([0-9]+\\.[0-9]+)%/i)?.[1]||cpiText.match(/Consumer Price Index.*?([0-9]+\\.[0-9]+)%/i)?.[1];let trimmed=cpiText.match(/Trimmed mean inflation was ([0-9]+\\.[0-9]+)%/i)?.[1]||'';let period=cpiText.match(/In the 12 months to ([A-Za-z]+ 20[0-9]{2})/i)?.[1]||'latest';let nextCpi=cpiText.match(/Next Release ([0-9]{1,2}\\/\\d{1,2}\\/20[0-9]{2})/i)?.[1]||'26/08/2026';if(!rate)throw Error('RBA rate not found');if(!cpi)throw Error('CPI not found');$('rba').innerHTML=`<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px\"><div class=\"kpi\"><div class=\"label\">Cash rate target</div><div class=\"value\">${esc(rate)}%</div><div class=\"delta\">Effective ${esc(eff)}${next?' · '+esc(next):''}</div></div><div class=\"kpi\"><div class=\"label\">CPI inflation</div><div class=\"value\">${esc(cpi)}%</div><div class=\"delta\">12 months to ${esc(period)} · Trimmed mean ${esc(trimmed)}% · Next: ${esc(nextCpi)}</div></div></div><div class=\"source\">CPI: ABS · latest available release. Official RBA cash rate and ABS inflation data.</div>`}catch(e){$('rba').innerHTML='<span class=\"neg\">RBA / CPI snapshot unavailable.</span>'}}"""
          if old not in s:
              raise SystemExit('Existing loadRba function not found; no patch applied')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Added CPI to RBA snapshot')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add CPI inflation to RBA snapshot'
          git push
