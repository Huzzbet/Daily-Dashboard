name: Refresh market data snapshot

on:
  push:
    paths:
      - '.github/workflows/market-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

concurrency:
  group: adviser-market-snapshot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  market-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market prices and build snapshot
        run: |
          python3 - <<'PY'
          import json, time, csv, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          symbols = [
            '^AXJO','^GSPC','^NDX','AUDUSD=X','^TNX','GC=F','^VIX','BZ=F',
            '^AXFJ','^AXIJ','^AXPJ','^AXHJ','^AXEJ','^AXNJ'
          ]
          now = int(time.time())
          start_2024 = int(datetime(2024, 12, 1, tzinfo=timezone.utc).timestamp())
          start_2021 = int(datetime(2021, 1, 1, tzinfo=timezone.utc).timestamp())
          headers = {'User-Agent':'Mozilla/5.0 (compatible; AdviserDailyBrief/1.0)'}
          output = {'updated':datetime.now(timezone.utc).isoformat(), 'source':'Yahoo Finance chart data + RBA F2', 'markets':{}, 'sectors':{}}

          def fetch(symbol, period):
              url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + urllib.parse.quote(symbol, safe='') + '?period1=' + str(period) + '&period2=' + str(now) + '&interval=1d&events=history'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              result = payload.get('chart',{}).get('result') or []
              if not result:
                  raise ValueError('No chart result')
              r = result[0]
              timestamps = r.get('timestamp') or []
              closes = ((r.get('indicators') or {}).get('quote') or [{}])[0].get('close') or []
              points = [(int(t),float(c)) for t,c in zip(timestamps,closes) if c is not None]
              return points

          def ret(a,b):
              return round((a/b-1)*100, 3) if a is not None and b else None

          for symbol in symbols:
              try:
                  period = start_2021 if symbol in ('^AXFJ','^AXIJ','^AXPJ','^AXHJ','^AXEJ','^AXNJ') else start_2024
                  points = fetch(symbol, period)
                  if not points:
                      raise ValueError('No usable prices')
                  last_ts, last = points[-1]
                  day = ret(last,points[-2][1]) if len(points)>1 else None
                  prior_2025 = [v for ts,v in points if datetime.fromtimestamp(ts,timezone.utc).year < 2025]
                  y2025 = [v for ts,v in points if datetime.fromtimestamp(ts,timezone.utc).year == 2025]
                  y2025_return = ret(y2025[-1],prior_2025[-1]) if y2025 and prior_2025 else None
                  ytd = ret(last,y2025[-1]) if y2025 else None
                  output['markets'][symbol] = {'cur':last,'ch':day,'ytd':ytd,'cy':y2025_return,'timestamp':last_ts}
                  if symbol in ('^AXFJ','^AXIJ','^AXPJ','^AXHJ','^AXEJ','^AXNJ'):
                      def since(days):
                          cutoff=now-days*86400
                          base=next((v for ts,v in points if ts>=cutoff),points[0][1])
                          return ret(last,base)
                      output['sectors'][symbol]={'day':day,'oneM':since(30),'oneY':since(365),'fiveY':since(1825)}
              except Exception as e:
                  output['markets'][symbol] = {'error':str(e)}

          # Official RBA F2 weekly government-bond-yield data; latest published observation is date-stamped.
          try:
              url = 'https://www.rba.gov.au/statistics/tables/csv/f2-data.csv'
              req = urllib.request.Request(url,headers=headers)
              raw = urllib.request.urlopen(req,timeout=25).read().decode('utf-8-sig')
              rows = list(csv.reader(raw.splitlines()))
              series = []
              for row in rows:
                  if not row:
                      continue
                  try:
                      dt = datetime.strptime(row[0].strip(),'%d-%b-%Y').replace(tzinfo=timezone.utc)
                      vals = [float(x.replace(',','')) for x in row[1:] if x.strip()]
                      if vals:
                          series.append((int(dt.timestamp()),vals[0]))
                  except Exception:
                      continue
              if series:
                  ts,val = series[-1]
                  prev = series[-2][1] if len(series)>1 else None
                  prior_2025 = [v for t,v in series if datetime.fromtimestamp(t,timezone.utc).year<2025]
                  y2025 = [v for t,v in series if datetime.fromtimestamp(t,timezone.utc).year==2025]
                  output['markets']['^AXJCGB10Y'] = {
                      'cur':val,'ch':ret(val,prev),
                      'ytd':ret(val,y2025[-1]) if y2025 else None,
                      'cy':ret(y2025[-1],prior_2025[-1]) if y2025 and prior_2025 else None,
                      'timestamp':ts,'source':'RBA F2',
                      'asof':datetime.fromtimestamp(ts,timezone.utc).strftime('%d %b %Y')
                  }
              else:
                  output['markets']['^AXJCGB10Y'] = {'error':'No dated observations found in RBA F2 CSV'}
          except Exception as e:
              output['markets']['^AXJCGB10Y'] = {'error':'RBA F2: '+str(e)}

          Path('market-data.json').write_text(json.dumps(output,separators=(',',':')),encoding='utf-8')
          print('Wrote market-data.json; successful symbols:',sum('cur' in x for x in output['markets'].values()))
          PY

      - name: Commit market snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh market data snapshot [skip ci]'
          git pull --rebase origin main
          git push
