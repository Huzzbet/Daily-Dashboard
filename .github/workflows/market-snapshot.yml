name: Refresh market data snapshot

on:
  push:
    paths:
      - '.github/workflows/market-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

jobs:
  market-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market prices and build snapshot
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          symbols = [
            '^AXJO','^GSPC','^NDX','AUDUSD=X','^AXJCGB10Y','^TNX','GC=F','^VIX','BZ=F',
            '^AXFJ','^AXIJ','^AXPJ','^AXHJ','^AXEJ','^AXNJ'
          ]
          now = int(time.time())
          start_2024 = int(datetime(2024, 12, 1, tzinfo=timezone.utc).timestamp())
          start_2021 = int(datetime(2021, 1, 1, tzinfo=timezone.utc).timestamp())
          headers = {'User-Agent':'Mozilla/5.0 (compatible; AdviserDailyBrief/1.0)'}
          output = {'updated':datetime.now(timezone.utc).isoformat(), 'source':'Yahoo Finance chart data', 'markets':{}, 'sectors':{}}

          def fetch(symbol, period):
              url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + urllib.parse.quote(symbol, safe='') + '?period1=' + str(period) + '&period2=' + str(now) + '&interval=1d&events=history'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              result = payload.get('chart',{}).get('result') or []
              if not result: raise ValueError('No chart result')
              r = result[0]
              timestamps = r.get('timestamp') or []
              closes = ((r.get('indicators') or {}).get('quote') or [{}])[0].get('close') or []
              points = [(int(t),float(c)) for t,c in zip(timestamps,closes) if c is not None]
              meta = r.get('meta') or {}
              return points, meta

          def ret(a,b):
              return round((a/b-1)*100, 3) if a is not None and b else None

          for symbol in symbols:
              try:
                  points, meta = fetch(symbol, start_2021 if symbol.startswith('^AX') and symbol not in ('^AXJO','^AXJCGB10Y') else start_2024)
                  if not points: raise ValueError('No usable prices')
                  last_ts, last = points[-1]
                  prev = meta.get('chartPreviousClose') or meta.get('previousClose')
                  if symbol in ('^TNX','^AXJCGB10Y') and prev: prev=float(prev)
                  day = ret(last,float(prev)) if prev else (ret(last,points[-2][1]) if len(points)>1 else None)
                  y2026 = next((v for ts,v in points if datetime.fromtimestamp(ts,timezone.utc).year == 2026), None)
                  y2025 = [v for ts,v in points if datetime.fromtimestamp(ts,timezone.utc).year == 2025]
                  y2025_return = ret(y2025[-1],y2025[0]) if len(y2025)>1 else None
                  ytd = ret(last,y2026) if y2026 else None
                  output['markets'][symbol] = {'cur':last,'ch':day,'ytd':ytd,'cy':y2025_return,'timestamp':last_ts}
                  if symbol in ('^AXFJ','^AXIJ','^AXPJ','^AXHJ','^AXEJ','^AXNJ'):
                      def since(days):
                          cutoff=now-days*86400
                          base=next((v for ts,v in points if ts>=cutoff),points[0][1])
                          return ret(last,base)
                      output['sectors'][symbol]={'day':day,'oneM':since(30),'oneY':since(365),'fiveY':since(1825)}
              except Exception as e:
                  output['markets'][symbol] = {'error':str(e)}
          Path('market-data.json').write_text(json.dumps(output,separators=(',',':')),encoding='utf-8')
          print('Wrote market-data.json; successful symbols:',sum('cur' in x for x in output['markets'].values()))
          PY

      - name: Commit market snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh market data snapshot [skip ci]'
          git push
