name: Refresh adviser content snapshots

on:
  push:
    paths:
      - '.github/workflows/live-data-refresh.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: adviser-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build news and economic data snapshot
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from html import unescape

          old = {}
          try:
              old = json.loads(Path('content-data.json').read_text(encoding='utf-8'))
          except Exception:
              pass

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          now = datetime.now(timezone.utc)
          cutoff = (now - timedelta(days=14)).strftime('%Y-%m-%d')

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def rss(url, source, limit=12):
              root = ET.fromstring(get(url))
              items = []
              for item in root.findall('.//item'):
                  title = (item.findtext('title') or '').strip()
                  link = (item.findtext('link') or '').strip()
                  rawdate = (item.findtext('pubDate') or '').strip()
                  try:
                      date = parsedate_to_datetime(rawdate).astimezone(timezone.utc).isoformat()
                  except Exception:
                      date = None
                  if title and link:
                      items.append({'title':title, 'link':link, 'date':date, 'src':source})
              return items[:limit]

          def google(query):
              q = urllib.parse.quote(query + ' after:' + cutoff)
              return 'https://news.google.com/rss/search?q=' + q + '&hl=en-AU&gl=AU&ceid=AU:en'

          feeds = {
            'global': [('Global markets',google('(global markets OR Wall Street OR bond yields OR commodities)')),
                       ('IPO and AI',google('(Anthropic OR OpenAI OR AI company) (IPO OR listing OR funding OR valuation)')),
                       ('Central banks',google('(Federal Reserve OR RBA OR ECB OR Bank of Japan) (interest rate OR inflation OR policy)'))],
            'adviser': [('Australian advice',google('Australia financial advice FAAA adviser regulation')),
                        ('ASIC advice',google('ASIC financial advice Australia adviser')),
                        ('Wealth news',google('Australian financial adviser wealth management news'))],
            'super': [('ASIC super',google('ASIC superannuation Australia retirement')),
                      ('APRA super',google('APRA superannuation fund Australia')),
                      ('Treasury retirement',google('Australia Treasury superannuation retirement tax'))],
            'insurance': [('ASIC insurance',google('ASIC insurance Australia life insurance claims')),
                          ('APRA insurance',google('APRA insurance Australia life insurance')),
                          ('AFCA claims',google('AFCA insurance claims Australia'))],
            'macro': [('RBA','https://www.rba.gov.au/rss/rss-cb.xml'),
                      ('ABS',google('ABS Australia CPI inflation employment GDP wages')),
                      ('Treasury',google('Australia Treasury economy inflation budget'))],
            'asx': [('ASX company news',google('ASX Australia company earnings results guidance profit warning dividend')),
                    ('Banks',google('CBA NAB ANZ Westpac Macquarie results Australia shares')),
                    ('Large caps',google('BHP Rio Tinto CSL Xero Wesfarmers Woolworths Goodman Group results ASX'))],
            'broker': [('FNArena','https://www.fnarena.com/index.php/feed/')]
          }

          groups = {}
          for group, specs in feeds.items():
              collected, seen = [], set()
              for source, url in specs:
                  try:
                      for item in rss(url, source):
                          key = re.sub(r'[^a-z0-9]+',' ',item['title'].lower()).strip()
                          if key and key not in seen:
                              seen.add(key)
                              collected.append(item)
                  except Exception as exc:
                      print('Feed failed:',group,source,str(exc)[:160])
              collected.sort(key=lambda x:x.get('date') or '',reverse=True)
              groups[group] = collected[:30]
              if not groups[group] and old.get('groups',{}).get(group):
                  groups[group] = old['groups'][group]
                  print('Retained previous headlines for',group)
              print(group,'items:',len(groups[group]))

          def page_text(url):
              raw = get(url).decode('utf-8','ignore')
              text = unescape(re.sub(r'<[^>]+>',' ',raw))
              return re.sub(r'\s+',' ',text)

          td_url = 'https://www.money.com.au/banking/term-deposit-rates'
          deposits = []
          try:
              txt = page_text(td_url)
              asof = re.search(r'(?:correct|accurate) as at\s+([0-9]{1,2}\s+[A-Za-z]+\s+20[0-9]{2})',txt,re.I)
              as_of = asof.group(1) if asof else None
              for months in (3,6,12):
                  patterns = [
                    rf'{months}\s*months?.{{0,180}}?([0-9]+\.[0-9]{{2}})%\s*p\.a\.\s*from\s+([^.;]+)',
                    rf'{months}\s*month[^0-9]{{0,80}}([0-9]+\.[0-9]{{2}})%'
                  ]
                  match = None
                  for pattern in patterns:
                      match = re.search(pattern,txt,re.I)
                      if match: break
                  prior = next((x for x in old.get('term_deposits',[]) if x.get('term')==f'{months} months'),{})
                  if match:
                      provider = re.sub(r'\s+[0-9]+\s*$','',match.group(2)).strip() if match.lastindex and match.lastindex>=2 else 'See comparison source'
                      deposits.append({'term':f'{months} months','rate':float(match.group(1)),'provider':provider,'source':td_url,'fallback':False,'as_of':as_of})
                  elif prior:
                      prior = dict(prior); prior['fallback'] = True
                      deposits.append(prior)
                  else:
                      deposits.append({'term':f'{months} months','rate':None,'provider':'Unavailable','source':td_url,'fallback':True})
          except Exception as exc:
              print('Term deposit source failed:',str(exc)[:180])
              deposits = [dict(x, fallback=True) for x in old.get('term_deposits',[])]

          rba = {'cash_rate':None,'effective_date':None,'source':'https://www.rba.gov.au/cash-rate-target-overview.html'}
          try:
              txt = page_text(rba['source'])
              match = re.search(r'Cash rate target\s+([0-9]+\.[0-9]+)\s*%\s+Effective date\s+([0-9]{1,2}\s+[A-Za-z]+\s+20[0-9]{2})',txt,re.I)
              if match:
                  rba.update({'cash_rate':float(match.group(1)),'effective_date':match.group(2)})
          except Exception as exc:
              print('RBA source failed:',str(exc)[:160])
          if rba['cash_rate'] is None and old.get('rba'):
              rba = old['rba']

          cpi = {'annual':None,'trimmed_mean':None,'period':None,'source':'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release'}
          try:
              txt = page_text(cpi['source'])
              match = re.search(r'In the 12 months to\s+([A-Za-z]+\s+20[0-9]{2}).{0,220}?CPI rose\s+([0-9]+\.[0-9]+)%',txt,re.I)
              if match:
                  cpi['period'] = match.group(1); cpi['annual'] = float(match.group(2))
              trimmed = re.search(r'Trimmed mean inflation (?:was|rose)\s+([0-9]+\.[0-9]+)%',txt,re.I)
              if trimmed: cpi['trimmed_mean'] = float(trimmed.group(1))
          except Exception as exc:
              print('ABS source failed:',str(exc)[:160])
          if cpi['annual'] is None and old.get('cpi'):
              cpi = old['cpi']

          # Property figures are deliberately retained as dated fallback snapshots until a reliable
          # accessible source can be validated; this job must not relabel them as fresh live data.
          property_rows = old.get('property',[])
          for row in property_rows:
              row['fallback'] = True

          data = {'updated':now.isoformat(),'groups':groups,'property':property_rows,
                  'term_deposits':deposits,'rba':rba,'cpi':cpi}
          Path('content-data.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Wrote content-data.json')
          PY

      - name: Publish content snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh adviser news and data snapshots [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          echo 'Snapshot push failed after three attempts' >&2
          exit 1
