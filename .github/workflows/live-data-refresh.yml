name: Refresh adviser content snapshots

on:
  push:
    paths:
      - '.github/workflows/live-data-refresh.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build news, macro, property and deposit snapshots
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          now = datetime.now(timezone.utc)

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def rss(url, source, limit=10):
              root = ET.fromstring(get(url))
              out = []
              for item in root.findall('.//item'):
                  title = (item.findtext('title') or '').strip()
                  link = (item.findtext('link') or '').strip()
                  rawdate = (item.findtext('pubDate') or '').strip()
                  try: date = parsedate_to_datetime(rawdate).astimezone(timezone.utc).isoformat()
                  except Exception: date = None
                  if title and link:
                      out.append({'title': title, 'link': link, 'date': date, 'src': source})
              return out[:limit]

          def google(q):
              return 'https://news.google.com/rss/search?q=' + urllib.parse.quote(q) + '&hl=en-AU&gl=AU&ceid=AU:en'

          import urllib.parse
          feed_specs = {
            'global': [
              ('Global markets', google('(global markets OR Wall Street OR bond yields OR commodities)')),
              ('IPO and AI', google('(Anthropic OR OpenAI OR AI company) (IPO OR listing OR funding OR valuation)')),
              ('Central banks', google('(Federal Reserve OR RBA OR ECB OR Bank of Japan) (interest rate OR inflation OR policy)'))],
            'adviser': [
              ('FAAA / advice', google('Australia financial advice FAAA adviser regulation')),
              ('ASIC / advice', google('ASIC financial advice Australia adviser')),
              ('InvestorDaily', google('InvestorDaily financial adviser Australia wealth'))],
            'super': [
              ('ASIC / super', google('ASIC superannuation Australia retirement')),
              ('APRA / super', google('APRA superannuation fund Australia')),
              ('Treasury / retirement', google('Australia Treasury superannuation retirement tax'))],
            'insurance': [
              ('ASIC / insurance', google('ASIC insurance Australia life insurance claims')),
              ('APRA / insurance', google('APRA insurance Australia life insurance')),
              ('AFCA / claims', google('AFCA insurance claims Australia'))],
            'macro': [
              ('RBA', 'https://www.rba.gov.au/rss/rss-cb.xml'),
              ('ABS', google('ABS Australia CPI inflation employment GDP wages')),
              ('Treasury', google('Australia Treasury economy inflation budget'))],
            'asx': [
              ('ASX company news', google('ASX Australia company earnings results guidance profit warning dividend')),
              ('Banks', google('CBA NAB ANZ Westpac Macquarie results Australia shares')),
              ('Large caps', google('BHP Rio Tinto CSL Xero Wesfarmers Woolworths Goodman Group results ASX'))],
            'broker': [
              ('FNArena', 'https://www.fnarena.com/index.php/feed/')]
          }

          groups = {}
          for group, specs in feed_specs.items():
              items, seen = [], set()
              for source, url in specs:
                  try:
                      for item in rss(url, source, 12):
                          key = re.sub(r'[^a-z0-9]+', ' ', item['title'].lower()).strip()
                          if key and key not in seen:
                              seen.add(key); items.append(item)
                  except Exception as e:
                      print('Feed failed:', group, source, str(e)[:180])
              items.sort(key=lambda x: x.get('date') or '', reverse=True)
              groups[group] = items[:30]
              print(group, 'items:', len(groups[group]))

          def page_text(url):
              raw = get(url).decode('utf-8', 'ignore')
              txt = unescape(re.sub(r'<[^>]+>', ' ', raw))
              return re.sub(r'\s+', ' ', txt), raw

          suburbs = [
            ('Bentleigh','https://www.realestate.com.au/vic/bentleigh-3204/'),
            ('Bentleigh East','https://www.realestate.com.au/vic/bentleigh-east-3165/'),
            ('Malvern','https://www.realestate.com.au/vic/malvern-3144/'),
            ('Torquay','https://www.realestate.com.au/vic/torquay-3228/'),
            ('Sorrento','https://www.realestate.com.au/vic/sorrento-3943/')
          ]
          property_rows = []
          for name, url in suburbs:
              row = {'name':name, 'median':None, 'growth':None, 'period':None, 'source':url}
              try:
                  txt, _ = page_text(url)
                  patterns = [
                    r'Median price snapshot for houses.{0,500}?Median price\\s+\\$([0-9,]+).{0,300}?Past 12 month growth\\s+(?:Up|Down)?\\s*([+-]?[0-9.]+)%',
                    r'Median price trend for houses.{0,500}?\\$([0-9,]+).{0,300}?Past 12 month growth:?\\s*([+-]?[0-9.]+)%'
                  ]
                  for pattern in patterns:
                      m = re.search(pattern, txt, re.I)
                      if m:
                          row['median'] = '$' + m.group(1)
                          row['growth'] = float(m.group(2))
                          break
                  p = re.search(r'(November|October|September|August|July|June|May|April|March|February|January)\\s+20[0-9]{2}\\s+-\\s+(?:October|September|August|July|June|May|April|March|February|January)\\s+20[0-9]{2}', txt, re.I)
                  if p: row['period'] = p.group(0)
              except Exception as e: print('Property failed:', name, str(e)[:150])
              property_rows.append(row)

          deposits = []
          td_url = 'https://www.money.com.au/banking/term-deposit-rates'
          try:
              txt, _ = page_text(td_url)
              for months in (3, 6, 12):
                  pattern = rf'{months}\\s*months?\\s+([0-9]+\\.[0-9]{{2}})%\\s+p\\.a\\.\\s+from\\s+([^.;]+)'
                  m = re.search(pattern, txt, re.I)
                  if not m:
                      pattern = rf'{months}\\s*months?.{{0,160}}?([0-9]+\\.[0-9]{{2}})%\\s+p\\.a\\.\\s+from\\s+([^.;]+)'
                      m = re.search(pattern, txt, re.I)
                  deposits.append({'term':f'{months} months','rate':float(m.group(1)) if m else None,'provider':m.group(2).strip() if m else 'Not available','source':td_url})
          except Exception as e:
              print('Term deposit source failed:', str(e)[:180])
              deposits = [{'term':f'{m} months','rate':None,'provider':'Unavailable','source':td_url} for m in (3,6,12)]


          rba = {'cash_rate':None,'effective_date':None,'source':'https://www.rba.gov.au/cash-rate-target-overview.html'}
          try:
              txt, _ = page_text(rba['source'])
              m = re.search(r'Cash rate target\s+([0-9]+\.[0-9]+)\s*%\s+Effective date\s+([0-9]{1,2}\s+[A-Za-z]+\s+20[0-9]{2})', txt, re.I)
              if m:
                  rba['cash_rate'] = float(m.group(1)); rba['effective_date'] = m.group(2)
          except Exception as e: print('RBA failed:', str(e)[:180])

          cpi = {'annual':None,'trimmed_mean':None,'period':None,'source':'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release'}
          try:
              txt, _ = page_text(cpi['source'])
              m = re.search(r'In the 12 months to\s+([A-Za-z]+\s+20[0-9]{2}):\s+The Consumer Price Index \(CPI\) rose\s+([0-9]+\.[0-9]+)%', txt, re.I)
              if m:
                  cpi['period'] = m.group(1); cpi['annual'] = float(m.group(2))
              m = re.search(r'Trimmed mean inflation (?:was|rose)\s+([0-9]+\.[0-9]+)%', txt, re.I)
              if m: cpi['trimmed_mean'] = float(m.group(1))
              m = re.search(r'In the 12 months to\s+([A-Za-z]+\s+20[0-9]{2})', txt, re.I)
              if m: cpi['period'] = m.group(1)
          except Exception as e: print('ABS CPI failed:', str(e)[:180])

          data = {'updated':now.isoformat(),'groups':groups,'property':property_rows,'term_deposits':deposits,'rba':rba,'cpi':cpi}
          Path('content-data.json').write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print('Wrote content-data.json')
          PY

      - name: Publish content snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh adviser news and data snapshots [skip ci]'
          git push
