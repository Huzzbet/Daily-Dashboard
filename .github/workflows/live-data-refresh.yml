name: Refresh adviser content snapshots

on:
  push:
    paths:
      - '.github/workflows/live-data-refresh.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: adviser-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build news and economic data snapshot
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from html import unescape

          old = {}
          try:
              old = json.loads(Path('content-data.json').read_text(encoding='utf-8'))
          except Exception:
              pass

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          now = datetime.now(timezone.utc)
          cutoff = (now - timedelta(days=14)).strftime('%Y-%m-%d')

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def rss(url, source, limit=12):
              root = ET.fromstring(get(url))
              items = []
              for item in root.findall('.//item'):
                  title = (item.findtext('title') or '').strip()
                  link = (item.findtext('link') or '').strip()
                  rawdate = (item.findtext('pubDate') or '').strip()
                  try:
                      date = parsedate_to_datetime(rawdate).astimezone(timezone.utc).isoformat()
                  except Exception:
                      date = None
                  if title and link:
                      items.append({'title':title, 'link':link, 'date':date, 'src':source})
              return items[:limit]

          def google(query):
              q = urllib.parse.quote(query + ' after:' + cutoff)
              return 'https://news.google.com/rss/search?q=' + q + '&hl=en-AU&gl=AU&ceid=AU:en'

          feeds = {
            'global': [('Global markets',google('(global markets OR Wall Street OR bond yields OR commodities)')),
                       ('IPO and AI',google('(Anthropic OR OpenAI OR AI company) (IPO OR listing OR funding OR valuation)')),
                       ('Central banks',google('(Federal Reserve OR RBA OR ECB OR Bank of Japan) (interest rate OR inflation OR policy)'))],
            'adviser': [('Australian advice',google('Australia financial advice FAAA adviser regulation')),
                        ('ASIC advice',google('ASIC financial advice Australia adviser')),
                        ('Wealth news',google('Australian financial adviser wealth management news'))],
            'super': [('ASIC super',google('ASIC superannuation Australia retirement')),
                      ('APRA super',google('APRA superannuation fund Australia')),
                      ('Treasury retirement',google('Australia Treasury superannuation retirement tax'))],
            'insurance': [('ASIC insurance',google('ASIC insurance Australia life insurance claims')),
                          ('APRA insurance',google('APRA insurance Australia life insurance')),
                          ('AFCA claims',google('AFCA insurance claims Australia'))],
            'macro': [('RBA',google('Reserve Bank of Australia RBA monetary policy cash rate bond yields')),
                      ('ABS',google('ABS Australia CPI inflation employment GDP wages')),
                      ('Treasury',google('Australia Treasury economy inflation budget'))],
            # Third-party reporting about ASX-listed issuers. The official ASX announcement
            # portal is linked in the dashboard; its public page terms prohibit commercial reuse.
            'asx': [('ASX issuer updates',google('(ASX company announcement OR ASX-listed company) (quarterly activities OR production report OR trading update OR earnings OR guidance)')),
                    ('Corporate actions',google('(ASX announcement OR ASX-listed) (capital raising OR takeover OR acquisition OR scheme OR dividend)')),
                    ('Market-sensitive coverage',google('Australia ASX company (profit warning OR earnings downgrade OR contract win OR operational update)'))],
            'broker': [('FNArena', 'https://www.fnarena.com/index.php/feed/'),
                       ('FNArena ratings and targets',google('site:fnarena.com (broker upgrade OR broker downgrade OR target price OR ratings OR forecast changes)')),
                       ('Broker calls',google('Australia ASX broker calls (upgrade OR downgrade OR target price OR earnings forecast)'))]
          }

          groups = {}
          for group, specs in feeds.items():
              collected, seen = [], set()
              for source, url in specs:
                  try:
                      for item in rss(url, source):
                          # Keep the broker panel focused on actual research signals and
                          # broker/company analysis, not unrelated sponsored or lifestyle posts.
                          if group == 'broker' and not re.search(
                              r'broker|rating|upgrade|downgrade|target price|forecast|analyst|recommendation|consensus|corporate results monitor|call report|outperform|underperform|market in numbers|winners and losers',
                              item['title'], re.I
                          ):
                              continue
                          key = re.sub(r'[^a-z0-9]+',' ',item['title'].lower()).strip()
                          if key and key not in seen:
                              seen.add(key)
                              collected.append(item)
                  except Exception as exc:
                      print('Feed failed:',group,source,str(exc)[:160])
              collected.sort(key=lambda x:x.get('date') or '',reverse=True)
              groups[group] = collected[:30]
              if not groups[group] and old.get('groups',{}).get(group):
                  groups[group] = old['groups'][group]
                  print('Retained previous headlines for',group)
              print(group,'items:',len(groups[group]))

          # Parse FNArena's public weekly ratings/targets report into structured
          # broker actions. We only extract fields explicitly present in the report.
          from html.parser import HTMLParser

          class ArticleBlocks(HTMLParser):
              def __init__(self):
                  super().__init__(); self.blocks=[]; self.buf=[]; self.tag=None; self.depth=0
              def handle_starttag(self, tag, attrs):
                  if tag in ('p','h2','h3','h4','li'):
                      if self.tag is None:
                          self.tag=tag; self.buf=[]; self.depth=1
                      elif self.tag is not None:
                          self.depth += 1
              def handle_data(self, data):
                  if self.tag is not None: self.buf.append(data)
              def handle_endtag(self, tag):
                  if self.tag is not None and tag in ('p','h2','h3','h4','li'):
                      self.depth -= 1
                      if self.depth <= 0:
                          value=re.sub(r'\s+',' ',' '.join(self.buf)).strip()
                          if value: self.blocks.append(value)
                          self.tag=None; self.buf=[]; self.depth=0

          broker_signals=[]
          try:
              candidates = rss('https://www.fnarena.com/index.php/feed/','FNArena',60)
              weekly = next((x for x in candidates if re.search(
                  r'weekly ratings.*targets.*forecast changes',x['title'],re.I)),None)
              if weekly:
                  article_url=weekly['link']
                  raw=get(article_url).decode('utf-8','ignore')
                  parser=ArticleBlocks(); parser.feed(raw)
                  blocks=parser.blocks
                  for i, block in enumerate(blocks):
                      head=re.search(
                          r'^(?P<company>.+?)\s+\(\((?P<ticker>[A-Z0-9]{2,6})\)\)\s+(?P<action>Upgrade|Downgrade)\s+to\s+(?P<new>.+?)\s+from\s+(?P<old>.+?)\s+by\s+(?P<broker>.+?)\s+\.B/H/S:',
                          block,re.I)
                      if not head: continue
                      ticker=head.group('ticker').upper()
                      new_rating=head.group('new').strip()
                      old_rating=head.group('old').strip()
                      broker=head.group('broker').strip()
                      detail=' '.join(blocks[i+1:i+5])
                      target_new=target_old=None
                      patterns=[
                          r'(?:target|price target)[^$]{0,100}\$([0-9,]+(?:\.[0-9]+)?)\s+from\s+\$([0-9,]+(?:\.[0-9]+)?)',
                          r'target\s+is\s+\$([0-9,]+(?:\.[0-9]+)?),?\s*(?:up|down)\s+from\s+\$([0-9,]+(?:\.[0-9]+)?)'
                      ]
                      for pattern in patterns:
                          tm=re.search(pattern,detail,re.I)
                          if tm:
                              target_new=float(tm.group(1).replace(',',''))
                              target_old=float(tm.group(2).replace(',',''))
                              break
                      broker_signals.append({
                          'company':head.group('company').strip().title(),
                          'ticker':ticker,
                          'broker':broker,
                          'action':head.group('action').title(),
                          'rating_from':old_rating,
                          'rating_to':new_rating,
                          'target_from':target_old,
                          'target_to':target_new,
                          'current_price':None,
                          'implied_upside_pct':None,
                          'date':weekly.get('date'),
                          'source':article_url,
                          'summary':detail[:420]
                      })
                  # Retrieve current quotes for a limited number of extracted tickers.
                  for signal in broker_signals[:20]:
                      try:
                          quote_url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(signal['ticker']+'.AX')+'?range=5d&interval=1d'
                          quote=json.loads(get(quote_url,12).decode('utf-8','ignore'))
                          result=quote.get('chart',{}).get('result') or []
                          if result:
                              meta=result[0].get('meta',{})
                              price=meta.get('regularMarketPrice')
                              if isinstance(price,(int,float)) and price>0:
                                  signal['current_price']=round(float(price),3)
                                  if signal['target_to'] is not None:
                                      signal['implied_upside_pct']=round((signal['target_to']/price-1)*100,1)
                      except Exception as exc:
                          print('Quote unavailable:',signal['ticker'],str(exc)[:100])
                  print('FNArena structured broker signals:',len(broker_signals),'from',article_url)
              else:
                  print('No FNArena weekly ratings report found in RSS; structured signals unavailable')
          except Exception as exc:
              print('FNArena structured report parse failed:',str(exc)[:200])

          # Report headline freshness separately from the snapshot generation time.
          # Thresholds allow slower-moving adviser/super/insurance coverage while
          # flagging stale market-sensitive ASX and macro headlines.
          freshness_hours = {
              'global': 36, 'macro': 48, 'asx': 48,
              'adviser': 72, 'super': 72, 'insurance': 72, 'broker': 72
          }
          feed_health = {}
          for group, items in groups.items():
              dates = []
              for item in items:
                  try:
                      stamp = datetime.fromisoformat(item['date'].replace('Z', '+00:00'))
                      if stamp.tzinfo is None:
                          stamp = stamp.replace(tzinfo=timezone.utc)
                      dates.append(stamp.astimezone(timezone.utc))
                  except Exception:
                      continue
              latest = max(dates) if dates else None
              age_hours = round((now - latest).total_seconds() / 3600, 1) if latest else None
              limit = freshness_hours.get(group, 72)
              status = 'unavailable' if latest is None else ('stale' if age_hours > limit else 'fresh')
              feed_health[group] = {
                  'status': status,
                  'latest': latest.isoformat() if latest else None,
                  'age_hours': age_hours,
                  'max_age_hours': limit,
                  'items': len(items)
              }
              print('FRESHNESS', group, status, 'age_hours=', age_hours, 'limit=', limit)


          def page_text(url):
              raw = get(url).decode('utf-8','ignore')
              text = unescape(re.sub(r'<[^>]+>',' ',raw))
              return re.sub(r'\s+',' ',text)

          td_url = 'https://www.money.com.au/banking/term-deposit-rates'
          deposits = []
          try:
              txt = page_text(td_url)
              asof = re.search(r'(?:correct|accurate) as at\s+([0-9]{1,2}\s+[A-Za-z]+\s+20[0-9]{2})',txt,re.I)
              as_of = asof.group(1) if asof else None
              for months in (3,6,12):
                  patterns = [
                    rf'{months}\s*months?.{{0,180}}?([0-9]+\.[0-9]{{2}})%\s*p\.a\.\s*from\s+([^.;]+)',
                    rf'{months}\s*month[^0-9]{{0,80}}([0-9]+\.[0-9]{{2}})%'
                  ]
                  match = None
                  for pattern in patterns:
                      match = re.search(pattern,txt,re.I)
                      if match: break
                  prior = next((x for x in old.get('term_deposits',[]) if x.get('term')==f'{months} months'),{})
                  if match:
                      provider = re.sub(r'\s+[0-9]+\s*$','',match.group(2)).strip() if match.lastindex and match.lastindex>=2 else 'See comparison source'
                      deposits.append({'term':f'{months} months','rate':float(match.group(1)),'provider':provider,'source':td_url,'fallback':False,'as_of':as_of})
                  elif prior:
                      prior = dict(prior); prior['fallback'] = True
                      deposits.append(prior)
                  else:
                      deposits.append({'term':f'{months} months','rate':None,'provider':'Unavailable','source':td_url,'fallback':True})
          except Exception as exc:
              print('Term deposit source failed:',str(exc)[:180])
              deposits = [dict(x, fallback=True) for x in old.get('term_deposits',[])]

          rba = {'cash_rate':None,'effective_date':None,'source':'https://www.rba.gov.au/cash-rate-target-overview.html'}
          try:
              txt = page_text(rba['source'])
              match = re.search(r'Cash rate target\s+([0-9]+\.[0-9]+)\s*%\s+Effective date\s+([0-9]{1,2}\s+[A-Za-z]+\s+20[0-9]{2})',txt,re.I)
              if match:
                  rba.update({'cash_rate':float(match.group(1)),'effective_date':match.group(2)})
          except Exception as exc:
              print('RBA source failed:',str(exc)[:160])
          if rba['cash_rate'] is None and old.get('rba'):
              rba = old['rba']

          cpi = {'annual':None,'trimmed_mean':None,'period':None,'source':'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release'}
          try:
              txt = page_text(cpi['source'])
              media = page_text('https://www.abs.gov.au/media-centre/media-releases/cpi-rose-43-year-september-2026')
              # Prefer the explicit annual statement in the ABS media release; never confuse the monthly 0.8% move with annual inflation.
              annual = re.search(r'CPI rose\s+([0-9]+\.[0-9]+)\s*per cent in the 12 months to\s+([A-Za-z]+\s+20[0-9]{2})',media,re.I)
              if annual:
                  cpi['annual'] = float(annual.group(1)); cpi['period'] = annual.group(2)
              # If ABS markup changes, retain the last verified annual value rather than
              # accidentally substituting the monthly CPI movement.
              trimmed = re.search(r'Trimmed mean annual inflation was\s+([0-9]+\.[0-9]+)\s*per cent',media,re.I)
              if not trimmed:
                  trimmed = re.search(r'Trimmed mean inflation was\s+([0-9]+\.[0-9]+)%',txt,re.I)
              if trimmed: cpi['trimmed_mean'] = float(trimmed.group(1))
          except Exception as exc:
              print('ABS source failed:',str(exc)[:160])
          if cpi['annual'] is None and old.get('cpi'):
              cpi = old['cpi']

          # Property figures are deliberately retained as dated fallback snapshots until a reliable
          # accessible source can be validated; this job must not relabel them as fresh live data.
          property_rows = old.get('property',[])
          for row in property_rows:
              row['fallback'] = True

          data = {'updated':now.isoformat(),'groups':groups,'feed_health':feed_health,
                  'broker_signals':broker_signals,
                  'source_links': {
                    'asx_announcements': 'https://www.asx.com.au/asx/v2/statistics/todayAnns.do',
                    'asx_historical': 'https://www.asx.com.au/markets/trade-our-cash-market/historical-announcements',
                    'fnarena': 'https://www.fnarena.com/'
                  },
                  'property':property_rows,'term_deposits':deposits,'rba':rba,'cpi':cpi}
          Path('content-data.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Wrote content-data.json')
          PY

      - name: Publish content snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh adviser news and data snapshots [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 3
          done
          echo 'Snapshot push failed after three attempts' >&2
          exit 1
